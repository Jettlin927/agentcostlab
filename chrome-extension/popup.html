<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentCostLab Token &amp; Cache Linter</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 400px;
        background: #0b1120;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.45;
      }
      .wrap {
        padding: 14px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
        font-weight: 700;
        color: #f8fafc;
      }
      .badge {
        font-size: 11px;
        color: #38bdf8;
        background: rgba(56, 189, 248, 0.12);
        border: 1px solid rgba(56, 189, 248, 0.3);
        padding: 2px 7px;
        border-radius: 999px;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 84px;
        gap: 8px;
        margin-bottom: 10px;
      }
      label {
        display: block;
        font-size: 11px;
        color: #94a3b8;
        margin-bottom: 4px;
      }
      select,
      input,
      textarea {
        width: 100%;
        background: #111c33;
        color: #f1f5f9;
        border: 1px solid #26344f;
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
      }
      textarea {
        min-height: 110px;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 10px 0;
      }
      .card {
        background: #111c33;
        border: 1px solid #22304a;
        border-radius: 8px;
        padding: 8px;
      }
      .card-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #94a3b8;
      }
      .card-val {
        margin-top: 2px;
        font-size: 14px;
        font-weight: 700;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .good {
        color: #34d399;
      }
      .warn {
        color: #fbbf24;
      }
      .issues {
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 150px;
        overflow-y: auto;
        margin-bottom: 10px;
      }
      .issue {
        padding: 7px 9px;
        border-radius: 6px;
        font-size: 11.5px;
        border: 1px solid #334155;
        background: #111827;
      }
      .issue.high {
        border-color: rgba(248, 113, 113, 0.45);
        color: #fecaca;
      }
      .issue.medium {
        border-color: rgba(251, 191, 36, 0.45);
        color: #fde68a;
      }
      .issue.clean {
        border-color: rgba(52, 211, 153, 0.35);
        color: #a7f3d0;
      }
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 11px;
        color: #94a3b8;
        border-top: 1px solid #1e293b;
        padding-top: 8px;
      }
      a {
        color: #38bdf8;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .source-note {
        font-size: 11px;
        color: #38bdf8;
        margin-bottom: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>AgentCostLab Linter</h1>
        <span class="badge">100% Local</span>
      </header>

      <div id="sourceNote" class="source-note" hidden></div>

      <div class="controls">
        <div>
          <label for="modelSelect">Pricing Model</label>
          <select id="modelSelect"></select>
        </div>
        <div>
          <label for="turnsInput">Turns</label>
          <input id="turnsInput" type="number" min="1" max="100" value="24" />
        </div>
      </div>

      <div>
        <label for="promptInput">CLAUDE.md / AGENTS.md / mcp.json</label>
        <textarea
          id="promptInput"
          placeholder="Paste CLAUDE.md, AGENTS.md, or mcp.json here (auto-loads on GitHub blob pages)..."
        ></textarea>
      </div>

      <div class="stats">
        <div class="card">
          <div class="card-label">Tokens</div>
          <div class="card-val" id="tokensVal">0</div>
        </div>
        <div class="card">
          <div class="card-label">1k Cached</div>
          <div class="card-val good" id="cachedVal">$0.00</div>
        </div>
        <div class="card">
          <div class="card-label">1k Uncached</div>
          <div class="card-val warn" id="uncachedVal">$0.00</div>
        </div>
      </div>

      <div class="issues" id="issuesList"></div>

      <footer>
        <span id="savingsNote">Cache savings: 0%</span>
        <a href="https://jettlin927.github.io/agentcostlab/" target="_blank" rel="noopener noreferrer">
          Full Simulator &amp; x402 MCP →
        </a>
      </footer>
    </div>
    <script type="module" src="popup.mjs"></script>
  </body>
</html>
